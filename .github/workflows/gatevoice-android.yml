name: Build GateVoice APK

# Builds the fully-offline GateVoice app, runs the parser unit test (the same
# cases proven in tools/parse_command.py), bundles the Vosk model, and uploads
# an installable debug APK as a downloadable artifact.

on:
  workflow_dispatch:
  push:
    branches: [ "claude/gemini-myq-gate-control-yo7f2d" ]
    paths:
      - "gemini-myq-gate/gatevoice-android/**"
      - ".github/workflows/gatevoice-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gemini-myq-gate/gatevoice-android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download offline Vosk model into assets
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          curl -fL --retry 3 -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          echo "Downloaded size:" && ls -lh model.zip
          unzip -q model.zip
          rm -rf app/src/main/assets/model-en-us
          mv vosk-model-small-en-us-0.15 app/src/main/assets/model-en-us
          # Vosk's StorageService requires a 'uuid' version marker in the model
          # dir; this small model ships without one, which caused the runtime
          # 'model-en-us/uuid' error. Its contents are arbitrary (cache key).
          if [ ! -f app/src/main/assets/model-en-us/uuid ]; then
            echo "gatevoice-vosk-small-en-us-0.15" > app/src/main/assets/model-en-us/uuid
          fi
          echo "Model contents:" && ls -R app/src/main/assets/model-en-us | head -50
          test -f app/src/main/assets/model-en-us/uuid || { echo "ERROR: model-en-us/uuid missing"; exit 1; }
          test -d app/src/main/assets/model-en-us/am   || { echo "ERROR: model-en-us/am missing"; exit 1; }
          echo "Model total size:" && du -sh app/src/main/assets/model-en-us

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run parser unit test
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GateVoice-debug-apk
          path: gemini-myq-gate/gatevoice-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
