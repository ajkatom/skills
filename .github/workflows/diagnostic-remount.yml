name: Controlled Ubuntu remount comparison
on:
  push:
    branches: [diagnostic/ubuntu-remount-compare-20261109]
    paths: [.github/workflows/diagnostic-remount.yml]
permissions:
  contents: read
jobs:
  freeze-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Freeze one shared image and package set
        shell: bash
        run: |
          set -euxo pipefail
          mkdir evidence
          docker pull --platform linux/amd64 python:3.12-alpine
          BASE=$(docker image inspect python:3.12-alpine --format '{{index .RepoDigests 0}}')
          printf 'FROM %s\nRUN apk add --no-cache bubblewrap iptables\n' "$BASE" > evidence/Dockerfile
          docker build --platform linux/amd64 -t remount-comparison:frozen -f evidence/Dockerfile .
          docker image inspect remount-comparison:frozen > evidence/image-inspect.json
          docker image inspect remount-comparison:frozen --format '{{.Id}}' > evidence/image-id.txt
          docker run --rm remount-comparison:frozen sh -c 'cat /etc/os-release; python3 --version; bwrap --version; iptables --version; apk info -vv' > evidence/packages.txt
          docker save remount-comparison:frozen | gzip -1 > evidence/image.tar.gz
          cd evidence
          sha256sum image.tar.gz > image.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frozen-image
          path: evidence/
          retention-days: 14
  compare:
    needs: freeze-image
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: e52756263b296b0ffd2f5b49aa5f89e3d63d2899
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11.18'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: frozen-image
          path: frozen
      - name: Verify identical frozen inputs
        shell: bash
        run: |
          set -euxo pipefail
          cd frozen
          sha256sum -c image.tar.gz.sha256
          gzip -dc image.tar.gz | docker load
          mkdir -p ../evidence
          docker image inspect remount-comparison:frozen > ../evidence/loaded-image-inspect.json
          jq -S '.[0].RootFS.Layers' image-inspect.json > expected-layers.json
          jq -S '.[0].RootFS.Layers' ../evidence/loaded-image-inspect.json > actual-layers.json
          diff -u expected-layers.json actual-layers.json
          docker run --rm remount-comparison:frozen sh -c 'cat /etc/os-release; python3 --version; bwrap --version; iptables --version; apk info -vv' > actual-packages.txt
          diff -u packages.txt actual-packages.txt
          python -m pip install pytest==8.4.2 iniconfig==2.1.0 packaging==25.0 pluggy==1.6.0 pygments==2.19.2
      - name: Record host and sandbox details
        shell: bash
        run: |
          mkdir -p evidence
          {
            git rev-parse HEAD
            cat /etc/os-release
            uname -a
            printf '\nRUNNER IMAGE\n%s %s\n' "$ImageOS" "$ImageVersion"
            docker version
            docker info
            python --version
            python -m pip freeze
            cat /sys/kernel/security/lsm || true
            cat /sys/module/apparmor/parameters/enabled || true
            sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone user.max_user_namespaces || true
            cat frozen/image-id.txt
            cat frozen/packages.txt
          } > evidence/host.txt 2>&1
          docker run --rm --cap-add SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined remount-comparison:frozen sh -c 'uname -a; cat /proc/self/status; cat /proc/self/attr/current || true; cat /proc/self/mountinfo; bwrap --version; iptables --version' > evidence/container.txt 2>&1
      - name: Run unchanged focused test using frozen fixture input
        shell: bash
        run: |
          set -o pipefail
          cd dark-factory
          cat > diagnostic_pin.py <<'PY'
          def pytest_collection_modifyitems(items):
              for item in items:
                  if item.module.__name__.endswith("test_linux_harness"):
                      item.module._DOCKERFILE = "FROM remount-comparison:frozen\n"
          PY
          PYTHONPATH="$PWD:$PWD/scripts" python -m pytest -p diagnostic_pin -vv -rA tests/test_linux_harness.py::test_probe_catches_cap_sys_admin_remount_escape 2>&1 | tee ../evidence/pytest.txt
      - name: Capture production probe subprocess diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          docker image inspect remount-comparison:frozen >/dev/null || exit 0
          docker run --rm -i --cap-add SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined -v "$PWD/dark-factory/scripts:/df:ro" -v "$PWD/dark-factory/tests:/tests:ro" remount-comparison:frozen python3 - <<'PY' >> evidence/probe-trace.txt 2>&1
          import ast, os, sys
          sys.path.insert(0, "/df")
          import df_sandbox
          os.makedirs("/tmp/deny", exist_ok=True)
          os.makedirs("/tmp/ws", exist_ok=True)
          original_run = df_sandbox.subprocess.run
          def logged_run(*args, **kwargs):
              result = original_run(*args, **kwargs)
              print("COMMAND", repr(args), "RETURN", result.returncode, "STDOUT", repr(result.stdout), "STDERR", repr(result.stderr), flush=True)
              return result
          df_sandbox.subprocess.run = logged_run
          tree = ast.parse(open("/tests/test_linux_harness.py").read())
          snippet = next(ast.literal_eval(node.value) for node in tree.body if isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == "_CAP_DROP_REGRESSION_SNIPPET" for t in node.targets))
          exec(snippet)
          PY
      - name: Inspect remount errno and child capability controls
        if: always()
        shell: bash
        run: |
          docker run --rm -i --cap-add SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined -v "$PWD/dark-factory/scripts:/df:ro" remount-comparison:frozen python3 - <<'PY' | tee evidence/remount-details.txt
          import os,sys,subprocess,json
          sys.path.insert(0,"/df")
          import df_sandbox
          os.makedirs("/tmp/deny",exist_ok=True); os.makedirs("/tmp/ws",exist_ok=True)
          child = r'''
          import ctypes,os,json
          print("STATUS",open("/proc/self/status").read(),flush=True)
          print("APPARMOR",open("/proc/self/attr/current").read(),flush=True)
          print("NS",[(n,os.readlink("/proc/self/ns/"+n)) for n in ["user","mnt"]],flush=True)
          print("MOUNTS",open("/proc/self/mountinfo").read(),flush=True)
          libc=ctypes.CDLL(None,use_errno=True)
          libc.mount.argtypes=[ctypes.c_char_p,ctypes.c_char_p,ctypes.c_char_p,ctypes.c_ulong,ctypes.c_void_p]
          for flags in [32,32|2|4,32|4096,32|4096|2|4]:
              ctypes.set_errno(0)
              rc=libc.mount(b"none",b"/tmp/deny",b"",flags,None)
              err=ctypes.get_errno()
              print("MOUNT",flags,rc,err,os.strerror(err),flush=True)
          '''
          b=df_sandbox.BACKENDS["linux"]
          for kind in ["hardened","weakened","explicit-admin"]:
              a=b.wrap_prefix("/tmp/deny","/tmp/ws")
              if kind!="hardened":
                  i=a.index("--cap-drop"); del a[i:i+2]
              if kind=="explicit-admin": a=a[:-1]+["--cap-add","CAP_SYS_ADMIN","--"]
              p=subprocess.run(a+[sys.executable,"-c",child],capture_output=True,text=True)
              print("CASE",kind,"RC",p.returncode,"OUT",p.stdout,"ERR",p.stderr,flush=True)
          
          PY
      - name: Isolate no-new-privileges remount and inspect audit
        if: always()
        shell: bash
        run: |
          docker run --rm -i --cap-add SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined remount-comparison:frozen python3 - <<'PY' | tee evidence/nnp.txt
          import os,ctypes,subprocess
          libc=ctypes.CDLL(None,use_errno=True)
          libc.mount.argtypes=[ctypes.c_char_p,ctypes.c_char_p,ctypes.c_char_p,ctypes.c_ulong,ctypes.c_void_p]
          for nnp in [False,True]:
              if nnp: print("SET_NNP",libc.prctl(38,1,0,0,0),flush=True)
              print("NNP",nnp,"LABEL",open("/proc/self/attr/current").read(),flush=True)
              p="/tmp/mnt"+str(nnp); os.makedirs(p,exist_ok=True)
              for flags,src,fs in [(0,b"tmpfs",b"tmpfs"),(32|1,b"none",b""),(32,b"none",b"")]:
                  ctypes.set_errno(0)
                  rc=libc.mount(src,p.encode(),fs,flags,None)
                  e=ctypes.get_errno()
                  print("MOUNT",flags,rc,e,os.strerror(e),flush=True)
          PY
          sudo sysctl -a 2>/dev/null | grep -i apparmor | tee evidence/apparmor-sysctl.txt || true
          sudo dmesg | grep -Ei 'apparmor|audit|denied' | tail -100 | tee evidence/audit.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: comparison-${{ matrix.os }}
          path: evidence/
          retention-days: 14
