# M47 condition #10: minimal CI that runs the dark-factory HERMETIC test suite
# on every push and PR. The RUNTIME is stdlib-only except for the one declared
# enterprise dependency (`cryptography`, used solely by scripts/df_custody.py
# and pinned in requirements-enterprise.txt) -- verified below. The test suite
# exercises the enterprise tier, so CI installs that one pinned requirement.
# This workflow IS the "CI validation" the external audit asked for.
#
# Hermetic by construction: DF_ALLOW_NETWORK_TESTS is NOT set, so the handful of
# tests that reach outside localhost (live OSV/api probes, the live candidate-
# network e2e) skip themselves rather than making real external connections.
# The probes are not weakened -- they are opt-in: run them by exporting
# DF_ALLOW_NETWORK_TESTS=1 in an environment with the network access (and,
# for the live adapter probes, the credentials) they need; this workflow
# deliberately defines no such job because the hosted runner has neither.
name: ci

on:
  push:
  pull_request:

# A superseded push's run proves nothing anyone will read — cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hermetic-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: dark-factory/requirements-dev.txt
      - name: Assert the runtime is stdlib-only apart from the pinned enterprise dep
        run: |
          cd dark-factory
          # No undeclared third-party import anywhere under scripts/: if this
          # greps a hit, the "stdlib-only apart from requirements-enterprise"
          # claim is false and CI must fail. `cryptography` is deliberately
          # absent from this pattern: it is the one declared, pinned exception.
          ! grep -rEn '^\s*(import|from)\s+(requests|numpy|pandas|pytest|yaml|docker)\b' scripts/
      - name: Lint for genuine-defect classes only
        run: |
          cd dark-factory
          # Scoped to rule families that indicate REAL defects (F: unused/
          # undefined names — an F821 undefined-name bug shipped in the custody
          # warning path before this gate existed; E9: syntax/io errors; PLE:
          # pylint errors). Style families are deliberately NOT gated.
          python -m pip install 'ruff==0.16.5'
          python -m ruff check --select F,E9,PLE scripts/
      - name: Run the hermetic test suite
        run: |
          cd dark-factory
          # Default pytest: DF_ALLOW_NETWORK_TESTS unset -> external-network
          # tests skip -> the run touches nothing outside localhost.
          # requirements-dev.txt is the M51 dev/test LOCK (exact pytest +
          # cryptography versions the skill is developed and tested against) —
          # CI runs the same locked environment, not whatever is newest today.
          # (Its cryptography pin also satisfies requirements-enterprise.txt's
          # runtime range for the enterprise-tier custody/proxy/seccomp tests.)
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
